<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Bacchus Studio</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#stage-content">Skip to workspace</a>
  <div class="shell">
    <aside class="sidebar" aria-label="Studio navigation">
      <div class="brand"><span class="brand-mark" aria-hidden="true">B</span><strong>Bacchus</strong></div>
      <div class="project-picker">
        <label for="projects">Project</label>
        <select id="projects"><option value="">Select a project</option></select>
        <button class="button sidebar-new" type="button" data-action="new-project"><span aria-hidden="true">+</span> New project</button>
      </div>
      <nav class="stages" id="stages" aria-label="Production stages"></nav>
      <nav class="studio-nav" id="studio-nav" aria-label="Studio tools">
        <button class="stage-link" type="button" data-view="styles"><span class="tool-icon style-icon" aria-hidden="true"></span><span>Styles</span></button>
        <button class="stage-link" type="button" data-view="library"><span class="tool-icon library-icon" aria-hidden="true"></span><span>Art library</span></button>
        <button class="stage-link" type="button" data-view="settings"><span class="tool-icon settings-icon" aria-hidden="true"></span><span>Settings</span></button>
        <button class="stage-link" id="quit-bacchus" type="button" data-action="quit-bacchus" disabled><span class="tool-icon quit-icon" aria-hidden="true"></span><span>Quit Bacchus</span></button>
      </nav>
      <div class="sidebar-footer"><span class="connection-dot" aria-hidden="true"></span><span id="connection-status">Connecting</span></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="breadcrumb"><span id="workspace-name">Projects</span><span aria-hidden="true">/</span><strong id="project-name">New project</strong></div>
        <div class="topbar-meta">
          <button id="mode-toggle" class="button small quiet" type="button" data-action="toggle-auto-mode" hidden></button>
          <span id="pack-name" class="pack" hidden></span>
        </div>
      </header>
      <div class="workspace">
        <div id="message" class="notice" role="status" aria-live="polite" hidden></div>
        <section id="stage-content" tabindex="-1" aria-label="Production workspace"></section>
      </div>
    </main>
  </div>
  <noscript><p class="notice error">Bacchus needs JavaScript to run its local workspace.</p></noscript>
</body>
</html>
